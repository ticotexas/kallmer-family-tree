<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kallmer Family Tree</title>

  <meta
    name="description"
    content="Browse individual profiles, family relationships, photographs, and stories in the Kallmer Family Archive."
  >

  <meta property="og:title" content="Browse the Kallmer Family Archive">
  <meta
    property="og:description"
    content="Browse individual profiles, family relationships, photographs, and stories in the Kallmer Family Archive."
  >
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ticotexas.github.io/kallmer-family-tree/tree.html">
  <meta property="og:image" content="https://ticotexas.github.io/kallmer-family-tree/images/kallmer-archive-logo.png">
  <meta
    property="og:image:alt"
    content="The Kallmer Family Archive"
  >

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Browse the Kallmer Family Archive">
  <meta
    name="twitter:description"
    content="Browse individual profiles, family relationships, photographs, and stories in the Kallmer Family Archive."
  >
  <meta name="twitter:image" content="https://ticotexas.github.io/kallmer-family-tree/images/kallmer-archive-logo.png">
  <meta
    name="twitter:image:alt"
    content="The Kallmer Family Archive"
  >

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=IBM+Plex+Mono:wght@400&family=Source+Serif+4:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/archive-search.css">

  <style>
    :root {
      --ledger-ink: #1f2e45;
      --prairie-wheat: #e8dcc3;
      --homestead-clay: #a8552e;
      --prairie-sage: #6b7c5a;
      --brass: #b08d3f;
      --paper: #fffaf0;
      --white: #ffffff;
      --tree-blue: #4f7194;
      --archive-search-accent: var(--homestead-clay);
      --archive-search-hover-background: #fff4df;
    }

    body {
      margin: 0;
      background: var(--prairie-wheat);
      font-family: "Source Serif 4", serif;
      color: var(--ledger-ink);
    }

    .archive-home-link {
      display: inline-block;
      margin-bottom: 3px;
      color: var(--prairie-sage);
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      letter-spacing: 0.045em;
      text-decoration: none;
    }

    .archive-home-link:hover,
    .archive-home-link:focus-visible {
      color: var(--homestead-clay);
      text-decoration: none;
    }

    header {
      padding: 22px 40px;
      border-bottom: 1px solid var(--brass);
    }

    .detail-header {
      box-sizing: border-box;
      min-height: 164px;
      padding: 16px 32px 18px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .detail-header > .header-main {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(30px, 3vw, 42px);
      font-weight: 600;
      line-height: 1.04;
    }


    .detail-header h1 {
      color: var(--homestead-clay);
    }

    .view-switch-link {
      display: inline-block;
      padding: 8px 13px;
      border: 1px solid var(--tree-blue);
      border-radius: 4px;
      background: var(--tree-blue);
      color: var(--paper);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      text-decoration: none;
      box-shadow: 0 1px 2px rgba(31, 46, 69, 0.12);
      transition:
        filter 120ms ease,
        transform 120ms ease,
        box-shadow 120ms ease;
    }

    .view-switch-link:hover,
    .view-switch-link:focus-visible {
      color: var(--paper);
      filter: brightness(0.92);
      transform: translateY(-1px);
      box-shadow: 0 3px 7px rgba(31, 46, 69, 0.17);
      outline: none;
    }

    .header-archive-status {
      margin-top: 4px;
      color: rgba(31, 46, 69, 0.62);
      font-family: "IBM Plex Mono", monospace;
      font-size: 10.5px;
      letter-spacing: 0.025em;
    }

    #content {
      display: flex;
      gap: 40px;
      padding: 40px;
      align-items: flex-start;
    }

    #tree {
      flex: 2;
      display: flex;
      justify-content: center;
      min-width: 0;
    }

    #details {
      flex: 1;
      background: var(--ledger-ink);
      color: var(--paper);
      border: 2px solid var(--brass);
      border-radius: 6px;
      padding: 28px;
      position: sticky;
      top: 20px;
      min-height: 180px;
      max-width: 390px;
      box-sizing: border-box;
      box-shadow: 0 8px 22px rgba(31, 46, 69, 0.22);
      opacity: 1;
      transition: opacity 170ms ease;
    }

    #details.details-panel-exiting,
    #details.details-panel-entering {
      opacity: 0.38;
    }

    #details h2 {
      margin-top: 0;
      font-family: "Fraunces", serif;
      color: var(--homestead-clay);
      font-size: 1.8rem;
      line-height: 1.1;
    }

    .detail-birth-name {
      margin: -8px 0 10px;
      color: #d8d1bd;
      font-size: 0.95rem;
      font-style: italic;
      line-height: 1.3;
    }

    #details h3 {
      margin-top: 28px;
      color: var(--brass);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #details .mono {
      color: #b7c69f;
    }

    #details .person-link {
      color: var(--paper);
    }

    #details .person-link:hover {
      color: var(--homestead-clay);
    }

    .mono {
      font-family: "IBM Plex Mono", monospace;
      color: var(--prairie-sage);
      font-size: 0.9rem;
    }

    .person-link {
      border: 0;
      background: none;
      padding: 0;
      color: var(--ledger-ink);
      font-family: inherit;
      font-size: inherit;
      text-align: left;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .person-link:hover {
      color: var(--homestead-clay);
    }

    .pedigree-chart {
      display: flex;
      flex-direction: column;
      gap: 28px;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
    }

    .ancestor-branches {
      display: grid;
      grid-template-columns: repeat(2, minmax(270px, 1fr));
      gap: 28px;
      align-items: start;
      justify-items: center;
    }

    .ancestor-branch {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    .great-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      width: 100%;
    }

    .generation-row {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .branch-label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      color: var(--prairie-sage);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-align: center;
      margin-bottom: -6px;
    }

    .generation-label {
      width: 100%;
      text-align: center;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.75rem;
      color: var(--prairie-sage);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: -10px;
    }

    .pedigree-couple {
      border: 1px solid var(--brass);
      background: var(--paper);
      padding: 13px 15px;
      width: 270px;
      min-height: 118px;
      min-width: 270px;
      max-width: 270px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 1px 0 rgba(31, 46, 69, 0.08);
    }

    .great-stack .pedigree-couple {
      height: 176px;
      min-height: 176px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .pedigree-couple.empty-card {
      background: rgba(255, 250, 240, 0.25);
      border: 1px dashed rgba(176, 141, 63, 0.45);
      box-shadow: none;
      pointer-events: none;
    }

    .ghost-line {
      visibility: hidden;
    }

    .pedigree-couple.current {
      border: 2px solid var(--homestead-clay);
      background: #fff4df;
    }

    .pedigree-person-name {
      display: block;
      width: 100%;
      border: 0;
      background: none;
      padding: 0;
      color: var(--ledger-ink);
      font-family: "Source Serif 4", serif;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.15;
      cursor: pointer;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .pedigree-person-name.long-name {
      font-size: 0.9rem;
    }

    .pedigree-person-name:hover {
      color: var(--homestead-clay);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .pedigree-age {
      margin-top: 2px;
    }

    .couple-divider {
      font-family: "IBM Plex Mono", monospace;
      color: var(--brass);
      font-size: 0.75rem;
      margin: 4px 0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .pedigree-dates {
      margin-top: 4px;
    }

    #detail-photo {
      text-align: center;
      margin-bottom: 15px;
    }

    #detail-photo img {
      width: 220px;
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid var(--brass);
    }

    .photo-gallery {
      display: none;
    }

    .photo-gallery.has-photo {
      display: block;
    }

    .photo-frame {
      position: relative;
      width: 100%;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .photo-gallery-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      margin: 0 auto;
      border-radius: 6px;
      border: 1px solid var(--brass);
      object-fit: contain;
      cursor: zoom-in;
    }

    .photo-lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: rgba(10, 18, 31, 0.94);
    }

    .photo-lightbox.open {
      display: flex;
    }

    .photo-lightbox-content {
      position: relative;
      width: min(1100px, 96vw);
      height: min(92vh, 900px);
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) 56px;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
    }

    .photo-lightbox-image-wrap {
      grid-column: 2;
      grid-row: 1;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-lightbox-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border: 1px solid var(--brass);
      border-radius: 6px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    .photo-lightbox-caption {
      grid-column: 2;
      grid-row: 2;
      min-height: 1.4em;
      color: var(--paper);
      text-align: center;
      font-size: 1rem;
      font-style: italic;
      line-height: 1.4;
    }

    .photo-lightbox-close,
    .photo-lightbox-nav {
      border: 1px solid var(--brass);
      border-radius: 4px;
      background: rgba(31, 46, 69, 0.9);
      color: var(--paper);
      cursor: pointer;
      font-family: "Source Serif 4", serif;
    }

    .photo-lightbox-close:hover,
    .photo-lightbox-close:focus,
    .photo-lightbox-nav:hover,
    .photo-lightbox-nav:focus {
      background: var(--homestead-clay);
      border-color: var(--homestead-clay);
      outline: none;
    }

    .photo-lightbox-close {
      position: absolute;
      top: -6px;
      right: -6px;
      z-index: 2;
      width: 42px;
      height: 42px;
      font-size: 1.5rem;
      line-height: 1;
    }

    .photo-lightbox-nav {
      width: 46px;
      height: 54px;
      font-size: 1.5rem;
      line-height: 1;
    }

    .photo-lightbox-previous {
      grid-column: 1;
      grid-row: 1;
      justify-self: center;
    }

    .photo-lightbox-next {
      grid-column: 3;
      grid-row: 1;
      justify-self: center;
    }

    .photo-lightbox-nav:disabled {
      visibility: hidden;
    }

    body.lightbox-open {
      overflow: hidden;
    }

    .photo-gallery-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 9px;
    }

    .photo-gallery-button {
      width: 34px;
      height: 30px;
      padding: 0;
      border: 1px solid var(--brass);
      border-radius: 4px;
      background: transparent;
      color: var(--paper);
      font-family: "Source Serif 4", serif;
      font-size: 1.15rem;
      line-height: 1;
      cursor: pointer;
    }

    .photo-gallery-button:hover,
    .photo-gallery-button:focus {
      background: var(--homestead-clay);
      border-color: var(--homestead-clay);
      outline: none;
    }

    .photo-gallery-button:disabled {
      display: none;
    }

    .photo-gallery-count {
      min-width: 88px;
      color: #b7c69f;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
    }

    .photo-gallery-caption {
      max-width: 270px;
      margin: 9px auto 0;
      color: #d8d1bd;
      font-size: 0.92rem;
      line-height: 1.35;
      font-style: italic;
    }

    #detail-story {
      margin-top: 28px;
      border-top: 1px solid var(--brass);
      padding-top: 22px;
    }

    #detail-story p {
      line-height: 1.55;
    }

    #detail-story .story-title {
      color: var(--brass);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    #detail-story h3 {
      color: var(--homestead-clay);
      margin-top: 8px;
      margin-bottom: 12px;
    }

    .story-link {
      display: block;
      width: 100%;
      text-align: left;

      padding: 10px 0;
      margin-top: 10px;

      border: none;
      background: none;

      color: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .story-link:hover {
      color: var(--homestead-clay);
      text-decoration: underline;
    }

    .story-link::before {
      content: "▸ ";
      color: var(--homestead-clay);
    }

    .story-link.open::before {
      content: "▾ ";
    }

    .story-content {
      margin: 8px 0 18px 18px;
      color: #b7c69f;
    }

    .story-content h4 {
      color: var(--brass);
      margin-top: 18px;
      margin-bottom: 10px;
      font-size: 1rem;
    }

    .story-link {
      outline: none;
    }

    .story-link:focus {
      color: var(--homestead-clay);
    }

    .story-content em {
      font-style: italic;
    }

    .story-content blockquote {
      margin: 1.25rem 0;
      padding: 0.15rem 0 0.15rem 1rem;
      border-left: 3px solid var(--brass);
      color: #d8d1bd;
      font-style: italic;
    }

    .story-content blockquote br {
      display: block;
      content: "";
      margin-top: 0.4rem;
    }

    .story-content strong {
      font-weight: 600;
      color: var(--paper);
    }

    @media (prefers-reduced-motion: reduce) {
      #details {
        transition: none;
      }
    }

    @media (max-width: 900px) {
      #content {
        flex-direction: column;
        padding: 24px;
      }

      #details {
        position: static;
        max-width: none;
        width: 100%;
      }



      .ancestor-branches {
        grid-template-columns: 1fr;
      }

      .pedigree-couple {
        width: 100%;
        min-width: 0;
        max-width: 360px;
      }

      .photo-frame {
        height: 340px;
      }

      .photo-lightbox {
        padding: 12px;
      }

      .photo-lightbox-content {
        width: 100%;
        height: 94vh;
        grid-template-columns: 44px minmax(0, 1fr) 44px;
      }

      .photo-lightbox-nav {
        width: 40px;
        height: 48px;
      }
    }

    .person-link span {
      display: block;
    }

    .link-dates,
    .link-age,
    .link-relationship {
      display: block;
      color: #b7c69f;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.88rem;
    }

    .link-relationship,
    .pedigree-relationship,
    .detail-relationship {
      color: #b7c69f;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      font-style: italic;
    }

    .link-relationship {
      margin-top: 0.18rem;
      text-decoration: none;
    }

    .pedigree-relationship {
      margin-top: 3px;
    }

    .detail-relationship {
      margin-top: 0.35rem;
    }


    .link-name {
      color: var(--paper);
    }
  </style>
</head>

<body>

  <header class="detail-header">
    <div class="header-main">
      <a href="index.html" class="archive-home-link">
        ← The Kallmer Family Archive
      </a>

      <h1>Person Details</h1>

      <div
        id="detail-archive-status"
        class="header-archive-status"
      ></div>

      <div id="search-area">
        <input type="text" id="person-search" aria-label="Search family members" placeholder="Search for a person..." autocomplete="off" />
        <div id="search-results"></div>
      </div>
    </div>

    <a
      id="tree-view-link"
      class="view-switch-link"
      href="family-tree.html"
    >
      Tree View
    </a>
  </header>

  <div id="content">
    <div id="tree"></div>

    <div id="details">
      <h2 id="detail-name">Select a Person</h2>
      <p id="detail-birth-name" class="detail-birth-name"></p>
      <p class="mono" id="detail-dates"></p>
      <div id="detail-photo"></div>
      <div id="detail-place"></div>
      <div id="detail-story"></div>
    </div>
  </div>

  <div
    id="photo-lightbox"
    class="photo-lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Photo viewer"
    aria-hidden="true"
  >
    <div class="photo-lightbox-content">
      <button
        id="photo-lightbox-close"
        class="photo-lightbox-close"
        type="button"
        aria-label="Close photo viewer"
      >×</button>

      <button
        id="photo-lightbox-previous"
        class="photo-lightbox-nav photo-lightbox-previous"
        type="button"
        aria-label="Previous photo"
      >←</button>

      <div class="photo-lightbox-image-wrap">
        <img id="photo-lightbox-image" class="photo-lightbox-image" alt="">
      </div>

      <button
        id="photo-lightbox-next"
        class="photo-lightbox-nav photo-lightbox-next"
        type="button"
        aria-label="Next photo"
      >→</button>

      <div id="photo-lightbox-caption" class="photo-lightbox-caption"></div>
    </div>
  </div>

  <script src="js/archive-dates.js"></script>
  <script src="js/archive-search.js"></script>
  <script>
    const archiveDates = new ArchiveDates();

    fetch("public-data/family.json?v=" + Date.now())
      .then((response) => {
        if (!response.ok) {
          throw new Error(
            `Family data request failed with status ${response.status}.`
          );
        }

        return response.json();
      })
      .then((data) => {
        const tree = document.getElementById("tree");
        const searchInput = document.getElementById("person-search");

        searchInput.addEventListener("focus", () => {
          setTimeout(() => searchInput.select(), 0);
        });

        searchInput.addEventListener("click", () => {
          searchInput.select();
        });

        const searchResults = document.getElementById("search-results");

        const lightbox = document.getElementById("photo-lightbox");
        const lightboxImage = document.getElementById("photo-lightbox-image");
        const lightboxCaption = document.getElementById("photo-lightbox-caption");
        const lightboxClose = document.getElementById("photo-lightbox-close");
        const lightboxPrevious = document.getElementById("photo-lightbox-previous");
        const lightboxNext = document.getElementById("photo-lightbox-next");

        let activeLightboxGallery = null;

        function closePhotoLightbox() {
          lightbox.classList.remove("open");
          lightbox.setAttribute("aria-hidden", "true");
          document.body.classList.remove("lightbox-open");
          activeLightboxGallery = null;
        }

        function renderLightboxPhoto() {
          if (!activeLightboxGallery || activeLightboxGallery.photos.length === 0) {
            return;
          }

          const photo = activeLightboxGallery.photos[activeLightboxGallery.getCurrentIndex()];
          lightboxImage.src = activeLightboxGallery.photoUrl(photo);
          lightboxImage.alt = photo.alt || photo.caption || activeLightboxGallery.personName;
          lightboxCaption.textContent = photo.caption || "";
          lightboxPrevious.disabled = activeLightboxGallery.photos.length < 2;
          lightboxNext.disabled = activeLightboxGallery.photos.length < 2;
        }

        function openPhotoLightbox(galleryState) {
          activeLightboxGallery = galleryState;
          renderLightboxPhoto();
          lightbox.classList.add("open");
          lightbox.setAttribute("aria-hidden", "false");
          document.body.classList.add("lightbox-open");
          lightboxClose.focus();
        }

        lightboxClose.addEventListener("click", closePhotoLightbox);

        lightbox.addEventListener("click", event => {
          if (event.target === lightbox) {
            closePhotoLightbox();
          }
        });

        lightboxPrevious.addEventListener("click", () => {
          if (!activeLightboxGallery) return;
          activeLightboxGallery.previous();
          renderLightboxPhoto();
        });

        lightboxNext.addEventListener("click", () => {
          if (!activeLightboxGallery) return;
          activeLightboxGallery.next();
          renderLightboxPhoto();
        });

        document.addEventListener("keydown", event => {
          if (!lightbox.classList.contains("open")) return;

          if (event.key === "Escape") {
            closePhotoLightbox();
          } else if (event.key === "ArrowLeft") {
            lightboxPrevious.click();
          } else if (event.key === "ArrowRight") {
            lightboxNext.click();
          }
        });

        const peopleById = {};
        data.people.forEach(person => {
          peopleById[person.id] = person;
        });

        const detailArchiveStatus =
          document.getElementById("detail-archive-status");

        if (detailArchiveStatus) {
          detailArchiveStatus.textContent =
            `${data.people.length} individuals • ${data.families.length} families`;
        }

        let photoFolderMap = {};
        let storyFolderMap = {};

        const mediaFolderMapsReady = Promise.all([
          fetch("photos/index.json?v=" + Date.now())
            .then(response => response.ok ? response.json() : {})
            .catch(() => ({})),

          fetch("stories/index.json?v=" + Date.now())
            .then(response => response.ok ? response.json() : {})
            .catch(() => ({}))
        ]).then(([photoMap, storyMap]) => {
          photoFolderMap = photoMap || {};
          storyFolderMap = storyMap || {};
        });

        function photoFolderFor(personId) {
          return photoFolderMap[personId] || personId;
        }

        function storyFolderFor(personId) {
          return storyFolderMap[personId] || personId;
        }


        function normalizeText(text) {
          return (text || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[̀-ͯ]/g, "")
            .replace(/ł/g, "l")
            .replace(/ø/g, "o")
            .replace(/æ/g, "ae")
            .replace(/œ/g, "oe")
            .replace(/ð/g, "d")
            .replace(/þ/g, "th");
        }

        function alternateNameTexts(person) {
          const names = [];

          if (person.birth_name) {
            names.push(person.birth_name);
          }

          if (Array.isArray(person.alternate_names)) {
            person.alternate_names.forEach(entry => {
              if (typeof entry === "string") {
                names.push(entry);
              } else if (entry && entry.name) {
                names.push(entry.name);
              }
            });
          }

          return names;
        }

        const searchablePeople = data.people.map(person => ({
          person,
          searchName: normalizeText([
            person.name,
            ...alternateNameTexts(person)
          ].filter(Boolean).join(" "))
        }));

        function hideSearchResults() {
          searchResults.style.display = "none";
          searchResults.innerHTML = "";
        }

        function renderSearchResults(matches) {
          if (matches.length === 0) {
            searchResults.innerHTML = `<div class="mono search-empty">No matching people found</div>`;
            searchResults.style.display = "block";
            return;
          }

          searchResults.innerHTML = matches.map(({ person }) => `
            <button class="search-result" data-person-id="${person.id}">
              <span class="search-result-name">${person.name}</span>
              <span class="mono search-result-dates">${lifeDates(person)}</span>
            </button>
          `).join("");

          searchResults.style.display = "block";

          searchResults.querySelectorAll(".search-result").forEach(button => {
            button.onclick = () => {
              const selectedPerson = peopleById[button.dataset.personId];
              if (selectedPerson) {
                showDetails(selectedPerson);
                searchInput.value = selectedPerson.name;
                hideSearchResults();
              }
            };
          });
        }

        function setupSearch() {
          searchInput.addEventListener("input", () => {
            const query = normalizeText(searchInput.value.trim());

            if (query.length < 2) {
              hideSearchResults();
              return;
            }

            const matches = searchablePeople
              .filter(({ searchName }) => searchName.includes(query))
              .slice(0, 12);

            renderSearchResults(matches);
          });

          searchInput.addEventListener("keydown", event => {
            if (event.key === "Escape") {
              hideSearchResults();
              searchInput.blur();
            }
          });

          document.addEventListener("click", event => {
            if (!event.target.closest("#search-area")) {
              hideSearchResults();
            }
          });
        }

        function ageText(person) {
          if (!person || !person.birth) return "";

          const birthYear = archiveDates.extractYear(person.birth);
          if (!birthYear) return "";

          if (person.death) {
            const deathYear = archiveDates.extractYear(person.death);
            if (!deathYear) return "";

            const age = deathYear - birthYear;
            return age >= 0 && age < 125 ? ` (${age})` : "";
          }

          const currentYear = new Date().getFullYear();
          const age = currentYear - birthYear;
          return age >= 0 && age < 125 ? ` (${age})` : "";
        }

        function lifeDates(person) {
          if (!person) return "";
          const birth = person.birth || "?";
          const death = person.death ? ` – ${person.death}` : " – present";
          return `${birth}${death}${ageText(person)}`;
        }

        function birthPlace(person) {
          if (!person) return "";
          return person.birth_place || person.birthPlace || person.place || "";
        }

        function displayPlace(place) {
          if (!place) return "";

          const parts = place.split(",").map(part => part.trim());

          if (parts.length >= 3) {
            return `${parts[0]}, ${parts[parts.length - 1]}`;
          }

          return place;
        }


        function personButton(person, relationshipLabel = "") {
          const dates = lifeDates(person);
          const ageMatch = dates.match(/\(\d+\)$/);

          const age = ageMatch ? ageMatch[0] : "";
          const dateOnly = age ? dates.replace(age, "").trim() : dates;

          return `
    <button class="person-link" data-person-id="${person.id}">
      <span class="link-name">${person.name}</span>
      <span class="link-dates">${dateOnly}</span>
      ${age ? `<span class="link-age">${age}</span>` : ""}
      ${relationshipLabel
        ? `<span class="link-relationship">${relationshipLabel}</span>`
        : ""}
    </button>
  `;
        }

        function namesFromIds(ids) {
          if (!ids || ids.length === 0) return "None listed";

          return ids
            .map(id => peopleById[id])
            .filter(Boolean)
            .map(person => personButton(person))
            .join("<br>");
        }

        function peopleFromIdsOldestFirst(ids) {
          return (ids || [])
            .map(id => peopleById[id])
            .filter(Boolean)
            .sort((a, b) => {
              const dateDifference =
                archiveDates.birthDateSortValue(a) -
                archiveDates.birthDateSortValue(b);

              if (dateDifference !== 0) {
                return dateDifference;
              }

              return a.name.localeCompare(b.name);
            });
        }

        function namesFromIdsOldestFirst(ids) {
          if (!ids || ids.length === 0) return "None listed";

          return peopleFromIdsOldestFirst(ids)
            .map(person => personButton(person))
            .join("<br>");
        }

        function relationshipTypeLabel(type) {
          switch (type) {
            case "adopted":
              return "Adopted";
            case "foster":
              return "Foster";
            case "step":
              return "Step";
            default:
              return "";
          }
        }

        function childRelationshipLabel(parentId, child) {
          const family = data.families.find(
            entry =>
              (entry.husband === parentId || entry.wife === parentId) &&
              Array.isArray(entry.children) &&
              entry.children.includes(child.id)
          );

          if (!family) return "";

          const relationship = child.parent_relationships?.find(
            entry => entry.family === family.id
          );

          return relationshipTypeLabel(relationship?.type);
        }

        function exceptionalParentRelationshipLabel(child) {
          if (!Array.isArray(child.parent_relationships)) {
            return "";
          }

          for (const relationship of child.parent_relationships) {
            const label = relationshipTypeLabel(relationship.type);

            if (label) {
              return label;
            }
          }

          return "";
        }

        function childNamesOldestFirst(parent) {
          if (!parent.children || parent.children.length === 0) {
            return "None listed";
          }

          return peopleFromIdsOldestFirst(parent.children)
            .map(child =>
              personButton(
                child,
                childRelationshipLabel(parent.id, child)
              )
            )
            .join("<br>");
        }

        function marriageText(person) {
          if (!person.marriages || person.marriages.length === 0) return "";

          return person.marriages.map(m => {
            const spouse = peopleById[m.spouse];
            const spouseName = spouse ? personButton(spouse) : m.spouse;
            const marriageDetails = [
              m.date || m.marriage_date,
              displayPlace(m.place || m.marriage_place)
            ].filter(Boolean).join(" — ");
            const divorceDetails = [
              m.divorce_date,
              displayPlace(m.divorce_place)
            ].filter(Boolean).join(" — ");

            const lines = [spouseName];

            if (marriageDetails) {
              lines.push(`<span class="mono">${marriageDetails}</span>`);
            }

            if (m.divorced) {
              lines.push(
                `<span class="mono">Divorced${divorceDetails
                  ? ` ${divorceDetails}`
                  : ""}</span>`
              );
            }

            return lines.join("<br>");
          }).join("<br><br>");
        }

        function getParents(person) {
          return (person.parents || [])
            .map(id => peopleById[id])
            .filter(Boolean);
        }

        function getPrimarySpouse(person) {
          if (!person || !person.spouses || person.spouses.length === 0) return null;
          return peopleById[person.spouses[0]] || null;
        }

        function coupleKey(personA, personB) {
          const ids = [personA && personA.id, personB && personB.id]
            .filter(Boolean)
            .sort();
          return ids.join("+");
        }

        function uniquePeople(people) {
          const seen = new Set();
          return people.filter(person => {
            if (!person || seen.has(person.id)) return false;
            seen.add(person.id);
            return true;
          });
        }

        function parentCoupleFor(child) {
          const parents = getParents(child);
          if (parents.length === 0) return null;
          return { personA: parents[0] || null, personB: parents[1] || null };
        }

        function buildGrandparentBranches(person) {
          const parents = getParents(person);

          return parents.map(parent => {
            const grandparentCouple = parentCoupleFor(parent);
            if (!grandparentCouple) return null;

            const greatCouples = [
              grandparentCouple.personA ? parentCoupleFor(grandparentCouple.personA) : null,
              grandparentCouple.personB ? parentCoupleFor(grandparentCouple.personB) : null
            ];

            return {
              parent,
              grandparentCouple,
              greatCouples
            };
          }).filter(Boolean);
        }

        function pedigreePersonLine(person, relationshipLabel = "") {
          if (!person) return `<div class="mono">Unknown</div>`;

          const dates = lifeDates(person);
          const ageMatch = dates.match(/\(\d+\)$/);

          const age = ageMatch ? ageMatch[0] : "";
          const dateOnly = age ? dates.replace(age, "").trim() : dates;

          return `
            <button
              class="pedigree-person-name ${person.name.length > 22 ? "long-name" : ""}"
              data-person-id="${person.id}"
            > 
             ${person.name}
            </button>

            <div class="mono pedigree-dates">${dateOnly}</div>
            <div class="mono pedigree-age">${age || "&nbsp;"}</div>
            ${relationshipLabel
              ? `<div class="pedigree-relationship">${relationshipLabel}</div>`
              : ""}
         `;
        }
        function pedigreeCoupleCard(couple, isCurrent = false) {
          const personA = couple.personA;
          const personB = couple.personB;

          return `
            <div class="pedigree-couple ${isCurrent ? "current" : ""}">
              ${pedigreePersonLine(
                personA,
                couple.personARelationshipLabel || ""
              )}
              ${personB
                ? `<div class="couple-divider">and</div>${pedigreePersonLine(personB)}`
                : ""}
            </div>
          `;
        }

        function renderPedigree(person) {
          const branches = buildGrandparentBranches(person);
          const parentCouple = parentCoupleFor(person);

          const branchMarkup = branches.length ? `
            <div class="ancestor-branches">
              ${branches.map(branch => `
                <div class="ancestor-branch">
                  <div class="branch-label">Great-grandparents</div>
                  <div class="great-stack">
                    ${branch.greatCouples.map(couple =>
            couple
              ? pedigreeCoupleCard(couple)
              : `
                <div class="pedigree-couple empty-card">
                  <div class="pedigree-person-name ghost-line">Unknown</div>
                  <div class="mono pedigree-dates ghost-line">? – ?</div>
                  <div class="mono pedigree-age ghost-line">&nbsp;</div>
                  <div class="couple-divider ghost-line">and</div>
                  <div class="pedigree-person-name ghost-line">Unknown</div>
                  <div class="mono pedigree-dates ghost-line">? – ?</div>
                  <div class="mono pedigree-age ghost-line">&nbsp;</div>
                </div>
              `
          ).join("")}
                  </div>
                  <div class="branch-label">Grandparents</div>
                  ${pedigreeCoupleCard(branch.grandparentCouple)}
                </div>
              `).join("")}
            </div>
          ` : "";

          tree.innerHTML = `
            <div class="pedigree-chart">
              ${branchMarkup}

              ${parentCouple ? `
                <div class="generation-row">
                  <div class="generation-label">Parents</div>
                  ${pedigreeCoupleCard(parentCouple)}
                </div>
              ` : ""}

              <div class="generation-row">
                <div class="generation-label">Current family</div>
                ${pedigreeCoupleCard(
                  {
                    personA: person,
                    personB: getPrimarySpouse(person),
                    personARelationshipLabel:
                      exceptionalParentRelationshipLabel(person)
                  },
                  true
                )}
              </div>
            </div>
          `;

          attachPedigreeHandlers();
        }

        function attachPedigreeHandlers() {
          document.querySelectorAll(".pedigree-person-name").forEach(button => {
            button.onclick = () => {
              const nextPerson = peopleById[button.dataset.personId];
              if (nextPerson) {
                showDetails(nextPerson);
              }
            };
          });
        }

        function attachPersonLinkHandlers() {
          document.querySelectorAll(".person-link").forEach(button => {
            button.onclick = () => {
              const nextPerson = peopleById[button.dataset.personId];
              if (nextPerson) {
                showDetails(nextPerson);
              }
            };
          });
        }

        function formatInlineMarkdown(text) {
          return text
            .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
            .replace(/\*(.+?)\*/g, "<em>$1</em>")
            .replace(/\n/g, "<br>");
        }

        async function loadStory(person) {
          const storyDiv = document.getElementById("detail-story");

          storyDiv.style.display = "block";
          storyDiv.innerHTML = "";

          try {
            const response = await fetch(
              `stories/${storyFolderFor(person.id)}/index.json?v=${Date.now()}`
            );

            if (!response.ok) {
              throw new Error();
            }

            const files = await response.json();

            storyDiv.innerHTML = `
              <div class="story-title">Stories</div>
              <div id="story-links"></div>
            `;

            const linksDiv = document.getElementById("story-links");

            files.forEach(filename => {
              const label = filename
                .replace(/^\d+-/, "")
                .replace(/\.md$/, "")
                .replace(/-/g, " ")
                .replace(/\b\w/g, c => c.toUpperCase());

              const button = document.createElement("button");

              const contentDiv = document.createElement("div");
              contentDiv.className = "story-content";

              button.className = "story-link";
              button.textContent = label;

              button.onclick = async () => {

                if (button.classList.contains("open")) {
                  button.classList.remove("open");
                  contentDiv.innerHTML = "";
                  return;
                }

                document
                  .querySelectorAll(".story-link")
                  .forEach(btn => btn.classList.remove("open"));

                button.classList.add("open");

                const md = await fetch(
                  `stories/${storyFolderFor(person.id)}/${filename}?v=${Date.now()}`
                ).then(r => r.text());

                contentDiv.innerHTML =
                  md
                    .split(/\n\s*\n/)
                    .map(block => {
                      const paragraph = block.trim();

                      if (!paragraph) {
                        return "";
                      }

                      if (paragraph.startsWith("## ")) {
                        return `<h4>${formatInlineMarkdown(paragraph.substring(3))}</h4>`;
                      }

                      if (paragraph.startsWith("# ")) {
                        return `<h3>${formatInlineMarkdown(paragraph.substring(2))}</h3>`;
                      }

                      if (paragraph.startsWith("> ")) {
                        const quote = paragraph
                          .split("\n")
                          .map(line => line.replace(/^>\s?/, ""))
                          .join("\n");

                        return `<blockquote>${formatInlineMarkdown(quote)}</blockquote>`;
                      }

                      return `<p>${formatInlineMarkdown(paragraph)}</p>`;
                    })
                    .join("");
              };

              linksDiv.appendChild(button);
              linksDiv.appendChild(contentDiv);
            });

          } catch {
            storyDiv.style.display = "none";
            storyDiv.innerHTML = "";
          }
        }

        let photoGalleryRequest = 0;

        function normalizePhotoEntries(payload) {
          const rawEntries = Array.isArray(payload)
            ? payload
            : (payload && Array.isArray(payload.photos) ? payload.photos : []);

          return rawEntries
            .map(entry => {
              if (typeof entry === "string") {
                return {
                  file: entry,
                  caption: "",
                  alt: ""
                };
              }

              if (!entry || typeof entry !== "object") {
                return null;
              }

              const file = entry.file || entry.filename || entry.src || "";

              if (!file) {
                return null;
              }

              return {
                file,
                caption: entry.caption || "",
                alt: entry.alt || ""
              };
            })
            .filter(Boolean);
        }

        async function loadPhotoGallery(person) {
          const requestId = ++photoGalleryRequest;
          const photoDiv = document.getElementById("detail-photo");

          photoDiv.innerHTML = "";

          let photos = [];

          try {
            const response = await fetch(
              `photos/${photoFolderFor(person.id)}/index.json?v=${Date.now()}`
            );

            if (response.ok) {
              photos = normalizePhotoEntries(await response.json());
            }
          } catch {
            photos = [];
          }

          if (requestId !== photoGalleryRequest) {
            return;
          }

          // Existing portrait-only folders continue to work without index.json.
          if (photos.length === 0) {
            photos = [{
              file: "portrait.png",
              caption: "",
              alt: person.name
            }];
          }

          let currentIndex = 0;

          const gallery = document.createElement("div");
          gallery.className = "photo-gallery";

          const frame = document.createElement("div");
          frame.className = "photo-frame";

          const image = document.createElement("img");
          image.className = "photo-gallery-image";

          const controls = document.createElement("div");
          controls.className = "photo-gallery-controls";

          const previousButton = document.createElement("button");
          previousButton.type = "button";
          previousButton.className = "photo-gallery-button";
          previousButton.setAttribute("aria-label", "Previous photo");
          previousButton.textContent = "←";

          const count = document.createElement("span");
          count.className = "photo-gallery-count";

          const nextButton = document.createElement("button");
          nextButton.type = "button";
          nextButton.className = "photo-gallery-button";
          nextButton.setAttribute("aria-label", "Next photo");
          nextButton.textContent = "→";

          const caption = document.createElement("div");
          caption.className = "photo-gallery-caption";

          controls.append(previousButton, count, nextButton);
          frame.appendChild(image);
          gallery.append(frame, controls, caption);
          photoDiv.appendChild(gallery);

          function photoUrl(photo) {
            const encodedFile = photo.file
              .split("/")
              .map(part => encodeURIComponent(part))
              .join("/");

            return `photos/${photoFolderFor(person.id)}/${encodedFile}`;
          }

          function renderPhoto() {
            const photo = photos[currentIndex];

            image.src = photoUrl(photo);
            image.alt = photo.alt || photo.caption || person.name;

            count.textContent = photos.length > 1
              ? `Photo ${currentIndex + 1} of ${photos.length}`
              : "Photo 1 of 1";

            previousButton.disabled = photos.length < 2;
            nextButton.disabled = photos.length < 2;

            caption.textContent = photo.caption || "";
            caption.style.display = photo.caption ? "block" : "none";

            if (
              activeLightboxGallery
              && activeLightboxGallery.personId === person.id
            ) {
              renderLightboxPhoto();
            }
          }

          function showPreviousPhoto() {
            currentIndex = (currentIndex - 1 + photos.length) % photos.length;
            renderPhoto();
          }

          function showNextPhoto() {
            currentIndex = (currentIndex + 1) % photos.length;
            renderPhoto();
          }

          previousButton.onclick = showPreviousPhoto;
          nextButton.onclick = showNextPhoto;

          image.tabIndex = 0;
          image.setAttribute("role", "button");
          image.setAttribute("aria-label", "Open full-size photo");

          image.onclick = () => {
            openPhotoLightbox({
              personId: person.id,
              personName: person.name,
              photos,
              getCurrentIndex: () => currentIndex,
              previous: showPreviousPhoto,
              next: showNextPhoto,
              photoUrl
            });
          };

          image.onkeydown = event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              image.click();
            }
          };

          image.onload = () => {
            gallery.classList.add("has-photo");
          };

          image.onerror = () => {
            // If a listed gallery image is missing, skip it when possible.
            if (photos.length > 1) {
              photos.splice(currentIndex, 1);

              if (currentIndex >= photos.length) {
                currentIndex = 0;
              }

              renderPhoto();
              return;
            }

            gallery.remove();
          };

          renderPhoto();
        }

        function birthNameLabel(person) {
          const birthName = String(person && person.birth_name || "").trim();
          const preferredName = String(person && person.name || "").trim();

          if (!birthName || normalizeText(birthName) === normalizeText(preferredName)) {
            return "";
          }

          return `Born ${birthName}`;
        }

        let detailTransitionId = 0;

        function showDetails(person, historyMode = "push") {
          const transitionId = ++detailTransitionId;
          const detailsElement = document.getElementById("details");
          const prefersReducedMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)",
          ).matches;

          closePhotoLightbox();

          if (historyMode !== "none") {
            const url = new URL(window.location);

            url.searchParams.set("person", person.id);

            const state = { personId: person.id };

            if (historyMode === "replace") {
              history.replaceState(state, "", url);
            } else {
              history.pushState(state, "", url);
            }
          }

          const render = () => {
            if (transitionId !== detailTransitionId) {
              return;
            }

            const treeViewLink = document.getElementById("tree-view-link");
            treeViewLink.href =
              `family-tree.html?person=${encodeURIComponent(person.id)}`;

            searchInput.value = person.name;

            renderPedigree(person);

            loadPhotoGallery(person);

            document.getElementById("detail-name").textContent = person.name;

            const birthNameElement = document.getElementById("detail-birth-name");
            const birthNameText = birthNameLabel(person);
            birthNameElement.textContent = birthNameText;
            birthNameElement.style.display = birthNameText ? "block" : "none";

            document.getElementById("detail-dates").textContent = lifeDates(person);
            const place = displayPlace(birthPlace(person));

            document.getElementById("detail-place").innerHTML = `
              ${place ? `<p class="mono">Born: ${place}</p>` : ""}

              <h3>Parents</h3>
              <p>${namesFromIds(person.parents)}</p>
              ${exceptionalParentRelationshipLabel(person)
                ? `<p class="detail-relationship">${exceptionalParentRelationshipLabel(person)}</p>`
                : ""}

              <h3>Spouse / Marriage</h3>
              <p>${marriageText(person) || namesFromIds(person.spouses)}</p>

              <h3>Children</h3>
              <p>${childNamesOldestFirst(person)}</p>

              <h3>Siblings</h3>
              <p>${namesFromIdsOldestFirst(person.siblings)}</p>
            `;

            loadStory(person);

            attachPersonLinkHandlers();

            detailsElement.dataset.personId = person.id;
            detailsElement.classList.remove("details-panel-exiting");

            if (!prefersReducedMotion) {
              detailsElement.classList.add("details-panel-entering");

              window.requestAnimationFrame(() => {
                window.requestAnimationFrame(() => {
                  if (transitionId === detailTransitionId) {
                    detailsElement.classList.remove("details-panel-entering");
                  }
                });
              });
            }
          };

          if (prefersReducedMotion || !detailsElement.dataset.personId) {
            render();
            return;
          }

          detailsElement.classList.remove("details-panel-entering");
          detailsElement.classList.add("details-panel-exiting");
          window.setTimeout(render, 170);
        }

        function showPersonNotFound() {
          const detailsElement = document.getElementById("details");
          const birthNameElement = document.getElementById("detail-birth-name");

          ++detailTransitionId;
          closePhotoLightbox();

          document.getElementById("tree").innerHTML = "";
          document.getElementById("detail-name").textContent =
            "Person Not Found";

          birthNameElement.textContent = "";
          birthNameElement.style.display = "none";

          document.getElementById("detail-dates").textContent = "";
          document.getElementById("detail-photo").innerHTML = "";
          document.getElementById("detail-place").innerHTML = `
            <p>
              The requested person could not be found in the public family archive.
            </p>
            <p>
              Use the search field above or return to the interactive family tree.
            </p>
          `;
          document.getElementById("detail-story").innerHTML = "";

          searchInput.value = "";

          const treeViewLink = document.getElementById("tree-view-link");
          treeViewLink.href = "family-tree.html";

          delete detailsElement.dataset.personId;
          detailsElement.classList.remove(
            "details-panel-exiting",
            "details-panel-entering"
          );
        }

        function personFromCurrentUrl() {
          const params = new URLSearchParams(window.location.search);
          const personId = params.get("person");

          if (personId) {
            return peopleById[personId] || null;
          }

          return peopleById["I0000"] || data.people[0] || null;
        }

        function showPersonFromCurrentUrl(historyMode = "none") {
          const person = personFromCurrentUrl();

          if (!person) {
            showPersonNotFound();
            return;
          }

          showDetails(person, historyMode);
        }

        window.addEventListener("popstate", () => {
          showPersonFromCurrentUrl("none");
        });

        mediaFolderMapsReady.then(() => {
          setupSearch();

          showPersonFromCurrentUrl("replace");
        });
      })
      .catch((error) => {
        console.error("Unable to load family archive:", error);

        const detailsElement = document.getElementById("details");
        const treeViewLink = document.getElementById("tree-view-link");
        const searchInput = document.getElementById("person-search");

        document.getElementById("tree").innerHTML = "";
        document.getElementById("detail-name").textContent =
          "Unable to Load Archive";
        document.getElementById("detail-birth-name").textContent = "";
        document.getElementById("detail-birth-name").style.display = "none";
        document.getElementById("detail-dates").textContent = "";
        document.getElementById("detail-photo").innerHTML = "";
        document.getElementById("detail-place").innerHTML = `
          <p>
            The family archive could not be loaded.
          </p>
          <p>
            Refresh the page or try again later.
          </p>
        `;
        document.getElementById("detail-story").innerHTML = "";

        if (searchInput) {
          searchInput.value = "";
          searchInput.disabled = true;
        }

        if (treeViewLink) {
          treeViewLink.href = "family-tree.html";
        }

        if (detailsElement) {
          delete detailsElement.dataset.personId;
          detailsElement.classList.remove(
            "details-panel-exiting",
            "details-panel-entering"
          );
        }
      });
  </script>

</body>

</html>
