<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | The Kallmer Family Archive</title>

    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=IBM+Plex+Mono:wght@400&family=Source+Serif+4:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --ledger-ink: #1F2E45;
            --prairie-wheat: #E8DCC3;
            --homestead-clay: #A8552E;
            --prairie-sage: #6B7C5A;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background: var(--prairie-wheat);
            color: var(--ledger-ink);
            font-family: "Source Serif 4", serif;
        }

        .not-found {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 30px 60px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            transform: translateY(-40px);
        }

        .archive-logo {
            display: block;
            width: 100%;
            max-width: 560px;
            margin: 0 auto 20px;
        }

        h1 {
            margin: 0 0 18px;
            font-family: "Fraunces", serif;
            font-size: clamp(2.2rem, 7vw, 4rem);
            font-weight: 600;
        }

        .message {
            max-width: 620px;
            margin: 0 auto 32px;
            font-size: 1.2rem;
            line-height: 1.65;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
        }

        .button {
            display: inline-block;
            padding: 14px 28px;
            border: 2px solid var(--homestead-clay);
            border-radius: 4px;
            background: var(--homestead-clay);
            color: var(--prairie-wheat);
            text-decoration: none;
            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .button:hover,
        .button:focus-visible {
            background: transparent;
            color: var(--homestead-clay);
        }

        .button-secondary {
            background: transparent;
            color: var(--homestead-clay);
        }

        .button-secondary:hover,
        .button-secondary:focus-visible {
            background: var(--homestead-clay);
            color: var(--prairie-wheat);
        }

        .button:focus-visible {
            outline: 3px solid var(--ledger-ink);
            outline-offset: 3px;
        }

        .site-footer {
            margin: 0 0 30px;
            padding: 0 20px;
            text-align: center;
            color: var(--prairie-sage);
            font-size: 0.85rem;
            opacity: 0.8;
        }

        @media (max-width: 700px) {
            .not-found {
                padding: 24px 22px 48px;
                transform: translateY(-20px);
            }

            .archive-logo {
                max-width: 95%;
            }

            .actions {
                flex-direction: column;
                align-items: stretch;
                max-width: 280px;
                margin: 0 auto;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .button {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main class="not-found">
        <img
            src="images/kallmer-archive-logo.png"
            alt="The Kallmer Family Archive"
            class="archive-logo"
        >

        <h1>Page Not Found</h1>

        <p class="message">
            The page you're looking for could not be found. It may have been
            moved, removed, or the address may be incorrect.
        </p>

        <nav class="actions" aria-label="Page not found options">
            <a href="index.html" class="button">
                Return Home
            </a>

            <a href="tree.html" class="button button-secondary">
                Browse the Archive
            </a>
        </nav>
    </main>

    <footer class="site-footer">
        Version 1.1 • July 2026
    </footer>
</body>

</html>
